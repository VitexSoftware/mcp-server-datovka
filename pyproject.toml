[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server-datovka"
version = "0.1.0"
description = "MCP server exposing the Czech ISDS Data Box system (datovka) as tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LGPL-3.0-or-later" }
authors = [{ name = "Vítězslav Dvořák", email = "info@vitexsoftware.cz" }]
dependencies = [
    "datovka>=0.1.0",
    "fastmcp>=2.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Topic :: Communications",
]

[project.scripts]
mcp-server-datovka = "mcp_server_datovka.server:main"

[project.urls]
Homepage = "https://github.com/VitexSoftware/mcp-server-datovka"

[tool.setuptools.packages.find]
where = ["src"]
