[metadata]
name = mcp-server-datovka
version = 0.1.0
description = MCP server exposing the Czech ISDS Data Box system (datovka) as tools
long_description = file: README.md
long_description_content_type = text/markdown
license = LGPL-3.0-or-later
author = Vítězslav Dvořák
author_email = info@vitexsoftware.cz
url = https://github.com/VitexSoftware/mcp-server-datovka
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)
    Operating System :: POSIX :: Linux
    Topic :: Communications

[options]
package_dir =
    =src
packages = find:
python_requires = >=3.10
install_requires =
    datovka>=0.1.0
    fastmcp>=2.0.0

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    mcp-server-datovka = mcp_server_datovka.server:main
